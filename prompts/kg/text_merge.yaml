# 文本融合 - 实体合并时的字段融合提示词
# 用于: src/kg/merger.py → _merge_fields()
name: text_merge
version: "1.0"
description: "实体字段融合系统提示词与用户模板"
messages:
  - role: system
    content: |
      你是一个文本融合专家。你的任务是概括和融合两个关于同一主题的描述性文本。
      请以'主体文本'为基础，吸收'辅助文本'中的新信息或不同视角，生成一段更全面、更通用的新描述。
      保持专业、简洁的风格。只输出融合后的文本，不要任何额外的解释或标题。
  - role: user
    content: |
      请融合以下关于 '{field}' 的描述：

      主体文本 (以此为准):
      ---
      {primary_content}
      ---

      辅助文本 (吸收其中的新信息):
      ---
      {member_content}
      ---

      融合后的新文本：
