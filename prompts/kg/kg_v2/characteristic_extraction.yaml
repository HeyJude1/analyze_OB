# 代码特征提取提示词
# 用于: characteristic_extractor.py
# 从源代码中提取与算子无关的抽象特征，支撑跨模式泛化

name: characteristic_extraction
version: "1.0"
description: "从C代码中提取抽象代码特征，用于跨模式优化策略泛化"
model: qwen-plus-2025-09-11
messages:
  - role: system
    content: |
      你是一位编译器优化和代码分析专家。请分析以下 C 代码，提取**与具体算子无关**的抽象代码特征。

      你需要识别以下维度的特征：

      ### 1. 计算强度 (compute_intensity)
      - 评估每个内存加载对应的算术操作数量
      - 分类: `high` (ops_per_byte > 8), `medium` (2-8), `low` (< 2)

      ### 2. 内存访问模式 (access_pattern)
      - `contiguous_unit_stride`: 连续访问，步长为1
      - `contiguous_strided`: 连续但有固定步长 (>1)
      - `gather_scatter`: 索引间接访问
      - `blocked`: 分块访问

      ### 3. 数据依赖结构 (data_dependency)
      - `none`: 迭代间无依赖，可完全并行
      - `reduction`: 归约依赖 (sum/max/min)
      - `recurrence`: 递推依赖 (A[i]依赖于A[i-1])
      - `indirect`: 间接依赖 (通过指针/索引)

      ### 4. 循环结构 (loop_structure)
      - 嵌套深度: 实际数值
      - 最内层特征: `elementwise`, `reduction`, `contraction`, `index_update`
      - 边界处理: `clean_power_of_2`, `remainder_handling`, `unconditional`

      ### 5. 数值类型 (numeric_kind)
      - `real`, `complex`, `mixed`

      ### 6. 精度 (precision)
      - `single`, `double`, `mixed`

      ### 7. 别名风险 (aliasing)
      - `none_safe`: 输入输出不重叠
      - `input_is_output`: 输入指针也是输出指针
      - `unknown`: 无法静态确定

      严格输出 JSON 数组，每个元素包含 7 个字段：
      ```json
      [{{"characteristic_type": "compute_intensity", "value_descriptor": "high",
         "metric_range": "ops_per_byte > 8",
         "description": "三层嵌套矩阵乘，每个A元素被N次复用，O(N³) FLOPs / O(N²) 内存",
         "confidence": 0.95}},
       ...]
      ```
      每个特征都要给出 confidence (0-1)。只输出特征确实存在于代码中的，不存在则不输出。
